<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reaction Time Game</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f172a;
  color:white;
}

.container{
  width:100%;
  max-width:700px;
  text-align:center;
  padding:20px;
}

h1{
  margin-bottom:15px;
}

#box{
  height:350px;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
  user-select:none;
  background:#ef4444;
  transition:0.15s;
}

#box:active{
  transform:scale(0.98);
}

.stats{
  margin-top:20px;
  display:flex;
  justify-content:space-around;
  font-size:18px;
}

button{
  margin-top:15px;
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>⚡ Reaction Time Game</h1>

  <div id="box">Click to Start</div>

  <div class="stats">
    <div>Best: <span id="best">--</span> ms</div>
    <div>Last: <span id="last">--</span> ms</div>
    <div>Average: <span id="avg">--</span> ms</div>
  </div>

  <button onclick="resetGame()">Reset</button>
</div>

<script>
const box = document.getElementById("box");
const bestEl = document.getElementById("best");
const lastEl = document.getElementById("last");
const avgEl = document.getElementById("avg");

let state = "idle"; // idle | waiting | ready
let startTime = 0;
let times = [];

function randomDelay(){
  return Math.random() * 3000 + 1500;
}

function startRound(){
  state = "waiting";
  box.style.background = "#b91c1c";
  box.textContent = "Wait for green...";

  setTimeout(() => {
    box.style.background = "#22c55e";
    box.textContent = "CLICK!";
    startTime = performance.now();
    state = "ready";
  }, randomDelay());
}

function updateStats(time){
  times.push(time);

  const best = Math.min(...times);
  const avg = Math.round(times.reduce((a,b)=>a+b,0) / times.length);

  bestEl.textContent = best;
  lastEl.textContent = time;
  avgEl.textContent = avg;
}

box.addEventListener("click", () => {

  if(state === "idle"){
    startRound();
    return;
  }

  // too early
  if(state === "waiting"){
    box.style.background = "#f59e0b";
    box.textContent = "Too early! Click to retry";
    state = "idle";
    return;
  }

  // correct click
  if(state === "ready"){
    const reaction = Math.round(performance.now() - startTime);

    box.style.background = "#1d4ed8";
    box.textContent = reaction + " ms";

    updateStats(reaction);

    state = "idle";

    setTimeout(startRound, 1000);
  }
});

function resetGame(){
  times = [];
  bestEl.textContent = "--";
  lastEl.textContent = "--";
  avgEl.textContent = "--";
  state = "idle";
  box.style.background = "#ef4444";
  box.textContent = "Click to Start";
}
</script>

</body>
</html>
