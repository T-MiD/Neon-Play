<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Typing Battle Arena</title>



<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}



body{

font-family:Arial, sans-serif;

background:

radial-gradient(circle at top,#2563eb,#020617);

overflow:hidden;

color:white;

height:100vh;

}



.container{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

height:100vh;

padding:20px;

}



h1{

font-size:3rem;

margin-bottom:15px;

text-shadow:0 0 15px rgba(255,255,255,0.3);

}



.scoreboard{

display:flex;

gap:30px;

margin-bottom:20px;

font-size:1.2rem;

background:rgba(255,255,255,0.08);

padding:12px 24px;

border-radius:15px;

backdrop-filter:blur(5px);

}



.game-area{

width:90%;

max-width:900px;

height:420px;

background:rgba(255,255,255,0.08);

border:2px solid rgba(255,255,255,0.1);

border-radius:20px;

position:relative;

overflow:hidden;

box-shadow:0 0 25px rgba(0,0,0,0.5);

}



.word{

position:absolute;

font-size:1.5rem;

font-weight:bold;

color:white;

text-shadow:0 0 12px rgba(255,255,255,0.5);

animation:glow 1s infinite alternate;

}



@keyframes glow{

from{

text-shadow:0 0 5px #fff;

}

to{

text-shadow:0 0 20px #38bdf8;

}

}



input{

margin-top:20px;

width:90%;

max-width:500px;

padding:15px;

border:none;

border-radius:12px;

font-size:1.2rem;

outline:none;

text-align:center;

}



button{

margin-top:20px;

padding:12px 24px;

border:none;

border-radius:12px;

background:#38bdf8;

color:white;

font-size:1rem;

cursor:pointer;

transition:0.2s;

}



button:hover{

transform:scale(1.05);

background:#0ea5e9;

}



.game-over{

position:absolute;

inset:0;

background:rgba(0,0,0,0.85);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

visibility:hidden;

z-index:10;

}



.game-over h2{

font-size:3rem;

margin-bottom:10px;

}



.game-over p{

font-size:1.3rem;

}

</style>

</head>



<body>



<div class="container">



<h1>⚔️ Typing Battle Arena</h1>



<div class="scoreboard">

<div>🏆 Score: <span id="score">0</span></div>

<div>❤️ Lives: <span id="lives">5</span></div>

<div>⚡ Level: <span id="level">1</span></div>

</div>



<div class="game-area" id="gameArea">



<div class="game-over" id="gameOver">

<h2>💀 Game Over</h2>

<p>Final Score: <span id="finalScore">0</span></p>

</div>



</div>



<input

type="text"

id="input"

placeholder="Type the falling words..."

autocomplete="off"

/>



<button onclick="restartGame()">Restart Game</button>



</div>



<script>



const WORDS = [

"javascript",

"dragon",

"galaxy",

"battle",

"wizard",

"rocket",

"victory",

"lightning",

"adventure",

"typing",

"challenge",

"keyboard",

"future",

"pixel",

"speed",

"gaming",

"energy",

"cyber",

"ninja",

"storm"

];



const gameArea = document.getElementById("gameArea");

const input = document.getElementById("input");



const scoreEl = document.getElementById("score");

const livesEl = document.getElementById("lives");

const levelEl = document.getElementById("level");



const gameOverEl = document.getElementById("gameOver");

const finalScoreEl = document.getElementById("finalScore");



let activeWords = [];



let score = 0;

let lives = 5;

let level = 1;



let gameRunning = true;



let speed = 1;



function randomWord(){

return WORDS[Math.floor(Math.random() * WORDS.length)];

}



function spawnWord(){



if(!gameRunning) return;



const word = document.createElement("div");



word.className = "word";



const text = randomWord();



word.innerText = text;



word.style.left =

Math.random() * (gameArea.clientWidth - 150) + "px";



word.style.top = "-30px";



gameArea.appendChild(word);



activeWords.push({

el: word,

text,

y: -30

});

}



function updateWords(){



activeWords.forEach((wordObj,index)=>{



wordObj.y += speed;



wordObj.el.style.top = wordObj.y + "px";



if(wordObj.y > gameArea.clientHeight - 40){



wordObj.el.remove();



activeWords.splice(index,1);



loseLife();

}

});

}



function loseLife(){



lives--;



livesEl.innerText = lives;



flashScreen();



if(lives <= 0){

endGame();

}

}



function flashScreen(){



document.body.style.background =

"radial-gradient(circle at top,#dc2626,#020617)";



setTimeout(()=>{

document.body.style.background =

"radial-gradient(circle at top,#2563eb,#020617)";

},150);

}



function endGame(){



gameRunning = false;



finalScoreEl.innerText = score;



gameOverEl.style.visibility = "visible";

}



function restartGame(){

location.reload();

}



input.addEventListener("input",()=>{



const typed = input.value.trim();



activeWords.forEach((wordObj,index)=>{



if(typed === wordObj.text){



createExplosion(wordObj.el);



wordObj.el.remove();



activeWords.splice(index,1);



score += 10;



scoreEl.innerText = score;



input.value = "";



if(score % 50 === 0){



level++;



levelEl.innerText = level;



speed += 0.4;

}

}

});

});



function createExplosion(el){



const rect = el.getBoundingClientRect();



const boom = document.createElement("div");



boom.innerHTML = "💥";



boom.style.position = "absolute";



boom.style.left = rect.left + "px";



boom.style.top = rect.top + "px";



boom.style.fontSize = "2rem";



boom.style.pointerEvents = "none";



document.body.appendChild(boom);



setTimeout(()=>{

boom.remove();

},400);

}



setInterval(()=>{

if(gameRunning){

updateWords();

}

},16);



setInterval(()=>{

if(gameRunning){

spawnWord();

}

},1600);



spawnWord();



input.focus();



</script>



</body>

</html>
