
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ Typing Battle Arena</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:
        radial-gradient(circle at top,
        #1e293b 0%,
        #0f172a 50%,
        #020617 100%);
    color:white;
    overflow:hidden;
    height:100vh;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    padding:20px;
}

h1{
    font-size:3rem;
    font-weight:800;
    margin-bottom:10px;
    color:#38bdf8;
    text-shadow:
        0 0 10px #38bdf8,
        0 0 30px #38bdf8;
}

.subtitle{
    color:#94a3b8;
    margin-bottom:20px;
}

.scoreboard{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.stat-card{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(56,189,248,0.2);
    border-radius:16px;
    padding:12px 18px;
    backdrop-filter:blur(10px);
    min-width:120px;
}

.stat-card span{
    font-size:1.4rem;
}

.game-area{
    width:90%;
    max-width:900px;
    height:450px;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            rgba(15,23,42,.95),
            rgba(2,6,23,.98)
        );

    border:2px solid rgba(56,189,248,.3);
    border-radius:24px;

    box-shadow:
        0 0 25px rgba(56,189,248,.2);
}

.word{
    position:absolute;
    font-size:1.6rem;
    font-weight:bold;
    color:white;

    text-shadow:
        0 0 8px #38bdf8,
        0 0 18px #38bdf8;

    animation:glow 1s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:
            0 0 8px #38bdf8;
    }

    to{
        text-shadow:
            0 0 12px #38bdf8,
            0 0 28px #8b5cf6;
    }
}

.controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
}

input{
    width:90%;
    max-width:500px;
    margin-top:20px;
    padding:16px;

    font-size:1.1rem;
    text-align:center;

    color:white;
    background:rgba(255,255,255,.05);

    border:1px solid rgba(56,189,248,.3);
    border-radius:14px;

    outline:none;
}

input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 20px rgba(56,189,248,.4);
}

button{
    margin-top:15px;
    padding:14px 28px;
    border:none;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #8b5cf6
        );

    color:white;
    font-weight:bold;
    cursor:pointer;

    transition:.25s;
}

button:hover{
    transform:scale(1.05);
}

.game-over{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.9);
    visibility:hidden;
    z-index:10;
}

.game-over h2{
    font-size:3rem;
    color:#ef4444;
    margin-bottom:10px;
}

.game-over p{
    font-size:1.4rem;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">

    <h1>⚔️ Typing Battle Arena</h1>
    <p class="subtitle">Destroy the falling words before they reach the bottom.</p>

    <div class="scoreboard">

        <div class="stat-card">
            <span>🏆</span>
            <div>
                <small>Score</small>
                <h3 id="score">0</h3>
            </div>
        </div>

        <div class="stat-card">
            <span>❤️</span>
            <div>
                <small>Lives</small>
                <h3 id="lives">5</h3>
            </div>
        </div>

        <div class="stat-card">
            <span>⚡</span>
            <div>
                <small>Level</small>
                <h3 id="level">1</h3>
            </div>
        </div>

    </div>

    <div class="game-area" id="gameArea">

        <div class="game-over" id="gameOver">
            <h2>💀 GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>

    </div>

    <div class="controls">
        <input
            type="text"
            id="input"
            autocomplete="off"
            placeholder="⌨️ Type words here..."
        >

        <button onclick="restartGame()">Restart Game</button>
    </div>

</div>

<script>
const WORDS = [
"javascript","dragon","galaxy","battle","wizard",
"rocket","victory","lightning","adventure","typing",
"challenge","keyboard","future","pixel","speed",
"gaming","energy","cyber","ninja","storm"
];

const gameArea = document.getElementById("gameArea");
const input = document.getElementById("input");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");

const gameOverEl = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");

let activeWords = [];
let score = 0;
let lives = 5;
let level = 1;
let speed = 1;
let gameRunning = true;

function randomWord(){
    return WORDS[Math.floor(Math.random()*WORDS.length)];
}

function spawnWord(){

    if(!gameRunning) return;

    const word = document.createElement("div");
    word.className = "word";

    const text = randomWord();

    word.textContent = text;
    word.style.left =
        Math.random() * (gameArea.clientWidth - 150) + "px";

    word.style.top = "-40px";

    gameArea.appendChild(word);

    activeWords.push({
        el:word,
        text:text,
        y:-40
    });
}

function updateWords(){

    for(let i = activeWords.length - 1; i >= 0; i--){

        const wordObj = activeWords[i];

        wordObj.y += speed;
        wordObj.el.style.top = wordObj.y + "px";

        if(wordObj.y > gameArea.clientHeight - 40){

            wordObj.el.remove();
            activeWords.splice(i,1);

            loseLife();
        }
    }
}

function loseLife(){

    lives--;

    livesEl.textContent = lives;

    if(lives <= 0){
        endGame();
    }
}

function endGame(){

    gameRunning = false;

    finalScoreEl.textContent = score;
    gameOverEl.style.visibility = "visible";
}

function restartGame(){
    location.reload();
}

input.addEventListener("input",()=>{

    const typed = input.value.trim().toLowerCase();

    for(let i = activeWords.length - 1; i >= 0; i--){

        const wordObj = activeWords[i];

        if(typed === wordObj.text){

            createExplosion(wordObj);

            wordObj.el.remove();
            activeWords.splice(i,1);

            score += 10;
            scoreEl.textContent = score;

            input.value = "";

            if(score % 50 === 0){

                level++;
                speed += 0.4;

                levelEl.textContent = level;
            }

            break;
        }
    }
});

function createExplosion(wordObj){

    const boom = document.createElement("div");

    boom.innerHTML = "💥";
    boom.style.position = "absolute";
    boom.style.left = wordObj.el.style.left;
    boom.style.top = wordObj.y + "px";
    boom.style.fontSize = "2rem";

    gameArea.appendChild(boom);

    setTimeout(()=>{
        boom.remove();
    },400);
}

setInterval(()=>{
    if(gameRunning){
        updateWords();
    }
},16);

setInterval(()=>{
    if(gameRunning){
        spawnWord();
    }
},1600);

spawnWord();

input.focus();
</script>

</body>
</html>
